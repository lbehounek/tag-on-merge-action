name: 'Tag on Merge'
description: 'Automatically bump semver tag on PR merge. Replaces anothrNick/github-tag-action.'

inputs:
  tag-prefix:
    description: 'Tag prefix (e.g., "v" produces v1.2.3)'
    required: false
    default: 'v'
  default-bump:
    description: 'Default bump level when no #major/#minor/#patch in PR title'
    required: false
    default: 'patch'
  release-branches:
    description: 'Comma-separated list of branches to tag'
    required: false
    default: 'main'
  initial-version:
    description: 'Starting version if no tags exist yet'
    required: false
    default: '0.1.0'
  github-token:
    description: 'GitHub token for pushing tags'
    required: true

outputs:
  new-tag:
    description: 'The new tag that was created'
    value: ${{ steps.tag.outputs.new_tag }}
  previous-tag:
    description: 'The previous tag'
    value: ${{ steps.tag.outputs.previous_tag }}
  bump:
    description: 'The bump level that was applied'
    value: ${{ steps.tag.outputs.bump }}

runs:
  using: 'composite'
  steps:
    - name: Bump and tag
      id: tag
      shell: bash
      env:
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        DEFAULT_BUMP: ${{ inputs.default-bump }}
        RELEASE_BRANCHES: ${{ inputs.release-branches }}
        INITIAL_VERSION: ${{ inputs.initial-version }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # Pass the attacker-controllable PR title through env, never inline ${{ }}
        # into the script — a title with quotes/backticks/$() would otherwise break
        # the shell or execute arbitrary commands (CWE-94). Referenced as "$PR_TITLE".
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        set -euo pipefail

        # Check if current branch is a release branch
        current_branch="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
        # For PR events, use the base branch
        if [ -n "${GITHUB_BASE_REF:-}" ]; then
          current_branch="$GITHUB_BASE_REF"
        fi

        IFS=',' read -ra branches <<< "$RELEASE_BRANCHES"
        is_release=false
        for branch in "${branches[@]}"; do
          # Trim surrounding whitespace. sed (not xargs) — xargs interprets
          # quotes/backslashes, which could mangle exotic branch names.
          branch=$(echo "$branch" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ "$current_branch" = "$branch" ]; then
            is_release=true
            break
          fi
        done

        if [ "$is_release" != "true" ]; then
          echo "::notice::Branch '$current_branch' is not a release branch ($RELEASE_BRANCHES). Skipping."
          exit 0
        fi

        # Determine bump from PR title (read from env, never interpolated inline)
        pr_title="${PR_TITLE:-}"
        bump="$DEFAULT_BUMP"

        # Native bash matching, NOT `echo "$pr_title" | grep -qi`. That idiom is
        # actively dangerous under `set -o pipefail`: `grep -q` exits the moment
        # it matches, so `echo` can take SIGPIPE (141) — and pipefail makes 141
        # the pipeline's status, so the condition reads FALSE precisely when the
        # marker WAS present. `set -e` doesn't fire (it's an `if` condition), so
        # the failure is silent: a `#minor` PR would quietly ship as a patch.
        # No pipe, no subprocess, nothing to signal. nocasematch keeps `grep -i`.
        shopt -s nocasematch
        if [[ "$pr_title" == *"#none"* ]]; then
          echo "::notice::PR title contains #none. Skipping tag."
          exit 0
        elif [[ "$pr_title" == *"#major"* ]]; then
          bump="major"
        elif [[ "$pr_title" == *"#minor"* ]]; then
          bump="minor"
        elif [[ "$pr_title" == *"#patch"* ]]; then
          bump="patch"
        fi
        shopt -u nocasematch

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Authenticate git with the provided token so tag fetch/push work even
        # when the caller's checkout used persist-credentials: false. This is what
        # the (required) github-token input is for — previously it was declared
        # but never used, so pushes silently depended on ambient checkout creds.
        # A scoped auth header is used (not a tokenized remote URL) so the token
        # never lands in a remote URL or log line. GITHUB_SERVER_URL keeps this
        # working on GitHub Enterprise Server too.
        if [ -n "${GITHUB_TOKEN:-}" ]; then
          server_host=$(echo "${GITHUB_SERVER_URL:-https://github.com}" | sed -E 's#^https?://##')
          auth_b64=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git config "http.https://${server_host}/.extraheader" "AUTHORIZATION: basic ${auth_b64}"
        fi

        # Retry loop handles races when multiple PRs merge simultaneously.
        # Each iteration fetches the latest remote tags to get the true latest version.
        max_attempts=5
        for attempt in $(seq 1 $max_attempts); do
          # Fetch remote tags to see tags created by concurrent runs
          git fetch --tags --force origin

          # Find the latest tag matching the prefix.
          #
          # `for-each-ref --count=1`, NOT `git tag --list ... | head -n 1`. With
          # hundreds of tags, `head` closes the pipe after line 1 while git is
          # still writing, git takes SIGPIPE (141), pipefail promotes it to the
          # pipeline status and `set -e` kills the step — producing NO output at
          # all, because it happens inside a command substitution. That is what
          # broke tagging on AirQ-Sports (508 tags): 3 of 4 merges on 2026-07-26
          # went untagged, including a `#minor` whose bump was lost entirely.
          # git selects the first match itself here, so there is no pipe to break.
          latest_tag=$(git for-each-ref --sort=-v:refname --count=1 \
                        --format='%(refname:short)' "refs/tags/${TAG_PREFIX}*")

          if [ -z "$latest_tag" ]; then
            new_version="$INITIAL_VERSION"
            echo "::notice::No existing tags found. Using initial version: $new_version"
          else
            # Strip prefix to get version
            version="${latest_tag#"$TAG_PREFIX"}"

            # Parse semver
            IFS='.' read -r major minor patch <<< "$version"
            major=${major:-0}
            minor=${minor:-0}
            patch=${patch:-0}

            case "$bump" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
            esac

            new_version="${major}.${minor}.${patch}"
          fi

          new_tag="${TAG_PREFIX}${new_version}"

          # Try to create and push the tag
          if git tag "$new_tag" 2>/dev/null && git push origin "$new_tag" 2>/dev/null; then
            echo "previous_tag=${latest_tag:-none}" >> "$GITHUB_OUTPUT"
            echo "new_tag=${new_tag}" >> "$GITHUB_OUTPUT"
            echo "bump=${bump}" >> "$GITHUB_OUTPUT"
            echo "::notice::Tagged ${new_tag} (${bump} bump from ${latest_tag:-none})"
            exit 0
          fi

          # Tag already exists (race condition) — clean up local tag and retry
          git tag -d "$new_tag" 2>/dev/null || true
          echo "::warning::Tag ${new_tag} already exists (attempt ${attempt}/${max_attempts}). Retrying..."
          sleep 1
        done

        echo "::error::Failed to create tag after ${max_attempts} attempts"
        exit 1
